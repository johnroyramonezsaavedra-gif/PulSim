<script>
const view={x:0,y:0,z:1,moved:false};let zl=null;

function lay(w,h,top,bot,left,right){const p=[];
 const row=(l,y,f)=>l.forEach((n,i)=>p.push({n,x:f?f(i,l.length):(i+1)*w/(l.length+1),y}));
 row(top,0);row(bot,h);
 left.forEach((n,i)=>p.push({n,x:0,y:(i+1)*h/(left.length+1)}));

 uno:{name:'Arduino Uno',w:240,h:120,ctl:1,pins:lay(240,120,rng('D',2,13),[...rng('A',0,5),'5V','3V3','GND','VIN']  ,[],[])},

ic(D,'pld','PLD (GAL16V8)',{L:rng('I',0,7),R:rng('IO',0,7)});

cdw.addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.c;if(!a||!cdp)return;
 if(a==='close')cdw.hidden=true;
 else if(a==='up')cfin.click();
 else if(a==='down'){if(!cdta.value.trim())cdMsg('Nothing to download yet.',false);else{dlFile(cdp.codeName||((cdp.ref||'program')+'.'+CODE[cdp.t].ext),cdta.value,'text/plain');cdMsg('Downloaded.',true)}}
 else if(a==='chk'){const v=codeVerify(cdp,cdta.value);cdMsg(v[1],v[0])}
 else if(a==='tpl'){if(cdta.value.trim()&&cdArm!=='tpl'){cdArm='tpl';cdMsg('This replaces your code. Press Template again to confirm.',false)}else{cdta.value=TPL[cdp.t].join(String.fromCharCode(10))+String.fromCharCode(10);cdta.dispatchEvent(new Event('input'));cdArm='';cdMsg('Starter template loaded.',true)}}
 else if(a==='clr'){if(cdta.value.trim()&&cdArm!=='clr'){cdArm='clr';cdMsg('Press Clear again to erase the code.',false)}else{cdta.value='';cdp.codeName='';$('cdname').textContent='';cdta.dispatchEvent(new Event('input'));cdArm='';cdMsg('Cleared.')}}});
$('cdth').addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;const r=cdw.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;const mv=ev=>{cdw.style.left=Math.max(0,ev.clientX-ox)+'px';cdw.style.top=Math.max(0,ev.clientY-oy)+'px';cdw.style.right='auto'},up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)});
const bcode=document.createElement('button');bcode.id='scode';bcode.title='Edit microcontroller code';
bcode.innerHTML=svgi(`<path d='M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>`)+'<span>Code</span>';
$('nw').before(bcode);bcode.onclick=()=>{const sp=selPart(),t=(sp&&CODE[sp.t])?sp:parts.find(q=>CODE[q.t]);if(t)openCode(t);else sst.textContent='Place a microcontroller first'};
function addCodeBadges(){parts.forEach(p=>{if(!CODE[p.t])return;const t=TYPES[p.t],has=!!(p.code&&p.code.trim()),g=el('g',{transform:`translate(${p.x+t.w+4},${p.y-22})`,'data-badge':1,style:'cursor:pointer'},cv);
 rc(g,0,0,34,16,'fill:'+(has?'var(--acc)':'var(--panel)')+';stroke:var(--acc);stroke-width:1.5');
 const tx=el('text',{x:17,y:12,'text-anchor':'middle',style:'font-size:10px;font-weight:700;pointer-events:none;fill:'+(has?'var(--panel)':'var(--acc)')},g);tx.textContent='</>';
 g.addEventListener('pointerdown',e=>e.stopPropagation());g.addEventListener('click',e=>{e.stopPropagation();openCode(p)})})}
const d4=draw;draw=function(){d4();addCodeBadges()};
draw();

const IDX='cl-index',PK='cl-p-',asv=document.createElement('span');asv.style.cssText='font-size:12px;color:var(--mute)';let curP=null,pT=0,thT=0;
const idxGet=()=>{try{return JSON.parse(localStorage.getItem(IDX)||'[]')}catch(e){return[]}};
const idxSet=a=>{try{localStorage.setItem(IDX,JSON.stringify(a))}catch(e){sst.textContent='Storage is full: delete old projects'}};
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?'just now':s<3600?Math.floor(s/60)+' min ago':s<86400?Math.floor(s/3600)+' h ago':Math.floor(s/86400)+' d ago'};
const newId=()=>'p'+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36);
function projSaveNow(){if(!curP)return;try{localStorage.setItem(PK+curP,prjData())}catch(e){sst.textContent='Could not autosave (storage full)'}
 const a=idxGet();let m=a.find(x=>x.id===curP);if(!m){m={id:curP,th:''};a.push(m)}m.name=pn.value||'Untitled project';m.t=Date.now();m.n=parts.length;idxSet(a);asv.textContent='Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function projAuto(){if(!curP)return;asv.textContent='Saving...';clearTimeout(pT);pT=setTimeout(projSaveNow,500);clearTimeout(thT);thT=setTimeout(projThumb,1800)}
function setThumb(i,u){const a=idxGet(),m=a.find(x=>x.id===i);if(m){m.th=u;idxSet(a)}if(!home.hidden)renderHome()}
function projThumb(){if(!curP)return;const i0=curP;if(!parts.length){setThumb(i0,'');return}let o;try{o=svgStr(true)}catch(e){return}
 const img=new Image();img.onload=()=>{const W=360,H=Math.max(130,Math.min(260,Math.round(W*o.h/o.w))),c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fbfdf6';g.fillRect(0,0,W,H);const s=Math.min(W/o.w,H/o.h)*.94;g.drawImage(img,(W-o.w*s)/2,(H-o.h*s)/2,o.w*s,o.h*s);setThumb(i0,c.toDataURL('image/jpeg',.75))};
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(o.s)}
function stopAll(){if(sim.st!=='stop')bs.onclick();scp.hidden=true;cdw.hidden=true;cm.hidden=true}
function hideHome(){home.hidden=true;asv.textContent=curP?asv.textContent:''}
function showHome(){projSaveNow();projThumb();renderHome();home.hidden=false}
function openProj(i){projSaveNow();clearTimeout(pT);clearTimeout(thT);let o=null;try{o=JSON.parse(localStorage.getItem(PK+i))}catch(e){}
 if(!o){sst.textContent='Could not open that project';return}stopAll();curP=i;prjLoad(o);const m=idxGet().find(x=>x.id===i);pn.value=(m&&m.name)||o.name||'Untitled project';hideHome()}
function newProj(name){projSaveNow();clearTimeout(pT);clearTimeout(thT);stopAll();curP=newId();parts=[];wires=[];sel=null;pend=null;pendPts=[];id=1;pn.value=name||'Untitled project';view.x=view.y=0;view.z=1;applyView();draw();projSaveNow();hideHome();histReset()}
function projRename(i,name){const a=idxGet(),m=a.find(x=>x.id===i);if(!m)return;m.name=name;idxSet(a);try{const o=JSON.parse(localStorage.getItem(PK+i));o.name=name;localStorage.setItem(PK+i,JSON.stringify(o))}catch(e){}if(i===curP)pn.value=name;renderHome()}
function projDel(i){idxSet(idxGet().filter(x=>x.id!==i));try{localStorage.removeItem(PK+i)}catch(e){}if(i===curP){curP=null;parts=[];wires=[];sel=null;draw()}renderHome()}
function projDup(i){try{const o=JSON.parse(localStorage.getItem(PK+i)),a=idxGet(),m=a.find(x=>x.id===i),n=newId();o.name=((m&&m.name)||'Project')+' copy';localStorage.setItem(PK+n,JSON.stringify(o));a.push({id:n,name:o.name,t:Date.now(),n:(o.parts||[]).length,th:(m&&m.th)||''});idxSet(a)}catch(e){}renderHome()}
function renderHome(){const a=idxGet().sort((x,y)=>y.t-x.t),g=$('hgrid');g.innerHTML='';$('hcount').textContent=a.length?'Your projects ('+a.length+')':'';$('hempty').hidden=a.length>0;
 a.forEach(m=>{const c=document.createElement('div');c.className='pc';
  c.innerHTML=`<div class='pth'>${m.th?`<img alt='' src='${m.th}'>`:icon(54,'e'+m.id)}</div><div class='pb'><div class='pnm'></div><div class='pm'></div><div class='pa'><button data-a='rn'>Rename</button><button data-a='dup'>Duplicate</button><button data-a='del'>Delete</button></div></div>`;
  c.querySelector('.pnm').textContent=m.name;c.querySelector('.pm').textContent=(m.n||0)+' parts \u00b7 '+ago(m.t)+(m.id===curP?' \u00b7 open':'');
  c.onclick=e=>{const b=e.target.closest('button');if(!b){openProj(m.id);return}e.stopPropagation();const k=b.dataset.a;
   if(k==='del'){if(b.dataset.arm)projDel(m.id);else{b.dataset.arm='1';b.textContent='Sure?';setTimeout(()=>{b.dataset.arm='';b.textContent='Delete'},2500)}}
   else if(k==='dup')projDup(m.id);
   else if(k==='rn'){const n=c.querySelector('.pnm'),inp=document.createElement('input');inp.value=m.name;inp.style.cssText='width:100%;margin:0;padding:3px 6px';n.replaceWith(inp);inp.focus();inp.select();inp.onclick=ev=>ev.stopPropagation();inp.onkeydown=ev=>{ev.stopPropagation();if(ev.key==='Enter')inp.blur()};inp.onblur=()=>projRename(m.id,inp.value.trim()||m.name)}};
  g.appendChild(c)})}
function importProj(f){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.parts)||!Array.isArray(o.wires))throw new Error('bad');projSaveNow();clearTimeout(pT);clearTimeout(thT);stopAll();curP=newId();prjLoad(o);pn.value=o.name||f.name.split('.')[0]||'Imported project';projSaveNow();projThumb();hideHome()}catch(e){sst.textContent='Could not add that file';showHome()}};r.readAsText(f)}

 'Start / Stop latch (motor)':`PROGRAM Main
VAR
  start AT %IX0.0 : BOOL;
  stop  AT %IX0.1 : BOOL;
  motor AT %QX0.0 : BOOL;

 'Blinker (TON timer)':`PROGRAM Main
VAR
  enable AT %IX0.0 : BOOL;
  lamp   AT %QX0.0 : BOOL;
  t1 : TON;
END_VAR

// t1.Q pulses once every 500 ms while enabled
t1(IN := enable AND NOT t1.Q, PT := T#500ms);
IF t1.Q THEN
  lamp := NOT lamp;
END_IF;
IF NOT enable THEN
  lamp := FALSE;
END_IF;
END_PROGRAM`,
 'Counter (CTU, preset 5)':`PROGRAM Main
VAR
  pulse AT %IX0.0 : BOOL;
  reset AT %IX0.1 : BOOL;
  full  AT %QX0.0 : BOOL;
  c : CTU;
END_VAR

c(CU := pulse, R := reset, PV := 5);
full := c.Q;
// show the count on outputs Q0.1 .. Q0.3 (binary)
Q0.1 := (c.CV MOD 2) = 1;
Q0.2 := ((c.CV / 2) MOD 2) >= 1;
Q0.3 := c.CV >= 4;
END_PROGRAM`,
 'Traffic light (sequence)':`PROGRAM Main
VAR
  run   AT %IX0.0 : BOOL;
  red   AT %QX0.0 : BOOL;
  amber AT %QX0.1 : BOOL;
  green AT %QX0.2 : BOOL;
  state : INT := 0;
  t : TON;
END_VAR

// each state lasts 2 s; t.Q pulses for one scan at the end of a state
t(IN := run AND NOT t.Q, PT := T#2s);
IF t.Q THEN
  state := state + 1;
  IF state > 2 THEN state := 0; END_IF;
END_IF;
red   := run AND state = 0;
green := run AND state = 1;
amber := run AND state = 2;

  high AT %IX0.1 : BOOL;
  pump AT %QX0.0 : BOOL;
  full AT %QX0.1 : BOOL;
END_VAR

// pump starts when level is low, stops when it reaches the high sensor

/* ===== Spectrum analyzer ===== */
function spRec(V){const p=sim.spec;if(!p)return;const N=16384;let r=sim.sring;if(!r||r.dt!==sim.dt)r=sim.sring={dt:sim.dt,a:new Float32Array(N),n:0};
 const a=sim.nodeOf(p.id+':IN');let v=a>=0?V[a]:0;if(sim.wired.has(p.id+':GND')){const b=sim.nodeOf(p.id+':GND');if(b>=0)v-=V[b]}r.a[r.n%N]=v;r.n++}
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
 for(let len=2;len<=n;len<<=1){const h=len>>1,ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let j=0;j<h;j++){const a=i+j,b=a+h,vr=re[b]*cr-im[b]*ci,vi=re[b]*ci+im[b]*cr;re[b]=re[a]-vr;im[b]=im[a]-vi;re[a]+=vr;im[a]+=vi;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}}
const spWc={};
function spWin(type,N){const key=type+N;if(spWc[key])return spWc[key];const w=new Float64Array(N);let s=0,s2=0;for(let i=0;i<N;i++){const x=2*Math.PI*i/N;w[i]=type==='hann'?.5-.5*Math.cos(x):type==='hamming'?.54-.46*Math.cos(x):type==='blackman'?.42-.5*Math.cos(x)+.08*Math.cos(2*x):1;s+=w[i];s2+=w[i]*w[i]}return spWc[key]={w,cg:s/N,enbw:N*s2/(s*s)}}
function spCompute(){const r=sim.sring;if(!r)return null;const MAXN=16384;let N=Math.min(SP.n,Math.min(r.n,MAXN));N=1<<Math.floor(Math.log2(Math.max(N,1)));if(N<64)return null;
 const {w,cg,enbw}=spWin(SP.win,N),re=new Float64Array(N),im=new Float64Array(N);let sm=0,sq=0;for(let k=0;k<N;k++){const x=r.a[(r.n-N+k)%MAXN];sm+=x;sq+=x*x;re[k]=x*w[k]}fft(re,im);
 const M=N/2,mag=new Float64Array(M+1);for(let k=0;k<=M;k++)mag[k]=(k===0||k===M?1:2)*Math.hypot(re[k],im[k])/(N*cg);
 return{N,fs:1/r.dt,bin:1/r.dt/N,mag,enbw,dc:sm/N,rms:Math.sqrt(sq/N)}}
const lobe=(m,k,e)=>{let s=0;for(let i=Math.max(0,k-3);i<=Math.min(m.length-1,k+3);i++)s+=m[i]*m[i];return Math.sqrt(s/e)};
function spPeak(d){const m=d.mag;let k=1,b=0;for(let i=1;i<m.length-1;i++)if(m[i]>b){b=m[i];k=i}
 if(b<1e-9)return{k:0,f:0,a:0};let delta=0,a=b;if(k>1&&k<m.length-1&&m[k-1]>0&&m[k+1]>0){const la=Math.log(m[k-1]),lb=Math.log(m[k]),lc=Math.log(m[k+1]),den=la-2*lb+lc;if(den<0)delta=.5*(la-lc)/den}a=lobe(m,k,d.enbw||1);return{k,f:(k+delta)*d.bin,a}}
const sfa=f=>f>=1e6?+(f/1e6).toPrecision(3)+'MHz':f>=1e3?+(f/1e3).toPrecision(3)+'kHz':+f.toPrecision(3)+'Hz',sfq=f=>f>=1e6?(f/1e6).toFixed(4)+' MHz':f>=1e3?(f/1e3).toFixed(3)+' kHz':f.toFixed(2)+' Hz';
const spdb=v=>20*Math.log10(Math.max(v,1e-12)/Math.SQRT2);
const spw=mkWin('spw','Spectrum Analyzer','');
spw.querySelector('.tb').innerHTML=`<div><canvas id='spc' width='620' height='340'></canvas><div class='ro' id='spro' style='max-width:620px;margin-top:6px'></div></div>
<div class='col' style='min-width:230px;max-width:260px'>
 <fieldset><legend>Acquire</legend><div class='row'><button data-a='run'>Stop</button><button data-a='clear'>Clear</button><label><input type='checkbox' data-k='hold'>Peak hold</label></div><div class='row'><label title='Runs the simulation faster so the FFT fills quickly'><input type='checkbox' data-k='fast' checked>Fast sampling</label></div></fieldset>
 <fieldset><legend>Frequency</legend><div class='row'>Max <select data-k='fmax'><option value='auto'>Auto (fit signal)</option><option value='full'>Full (Nyquist)</option>${[100,200,500,1e3,2e3,5e3,1e4,2e4,5e4,1e5,2e5,5e5,1e6].map(v=>`<option value='${v}'>${fmt(v,'Hz')}</option>`).join('')}</select></div><div class='row'>Axis <select data-k='xs'><option value='lin'>Linear</option><option value='log'>Logarithmic</option></select></div></fieldset>
 <fieldset><legend>Amplitude</legend><div class='row'>Units <select data-k='yu'><option value='db'>dBV (rms)</option><option value='lin'>Volts (peak)</option></select></div><div class='row'>Range <select data-k='range'><option>40</option><option>60</option><option>80</option><option selected>100</option><option>120</option><option>140</option></select> dB</div></fieldset>
 <fieldset><legend>FFT</legend><div class='row'>Size <select data-k='n'><option>1024</option><option>2048</option><option selected>4096</option><option>8192</option><option>16384</option></select></div><div class='row'>Window <select data-k='win'><option value='hann'>Hann</option><option value='hamming'>Hamming</option><option value='blackman'>Blackman</option><option value='rect'>Rectangular</option></select></div><div class='row'>Average <select data-k='avg'><option value='0'>Off</option><option value='4'>4</option><option value='8'>8</option><option value='16'>16</option></select></div></fieldset>
 <div class='ro'>Click the plot to place a marker. Wire the IN pin to a node to analyse its voltage (GND is optional, default ground).</div></div>`;
const spC=$('spc'),spG=spC.getContext('2d');
function spSet(e){const t=e.target,k=t.dataset&&t.dataset.k;if(!k)return;let v=t.type==='checkbox'?t.checked:t.value;if(['n','range','avg'].includes(k))v=+v;SP[k]=v;SP.tr=null;SP.pk=null;spDraw(true)}
spw.addEventListener('change',spSet);
spw.addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(a==='run'){SP.run=!SP.run;e.target.textContent=SP.run?'Stop':'Run'}else if(a==='clear'){sim.sring=null;SP.tr=null;SP.pk=null;SP.mk=null}});
spC.addEventListener('pointerdown',e=>{const r=spC.getBoundingClientRect(),x=(e.clientX-r.left)*spC.width/r.width;SP.mk=Math.max(0,Math.min(1,(x-54)/(spC.width-64)));spDraw(true)});
function niceMax(v){if(!(v>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e}
function spDraw(force){const p=sim.spec;if(spw.hidden)return;if(!p&&!force)return;const g=spG,W=spC.width,H=spC.height,x0=54,x1=W-10,y0=10,y1=H-30,pw=x1-x0,ph=y1-y0;
 g.fillStyle='#0b1d12';g.fillRect(0,0,W,H);
 if(SP.run||!SP.last)SP.last=spCompute();const d=SP.last;
 g.font='11px sans-serif';
 if(!d){g.fillStyle='#9ca3af';g.fillText(p?'Collecting samples...':'Wire a spectrum analyzer IN pin, then press Play',x0+10,y0+24);$('spro').textContent='';return}
 const M=d.mag.length-1;
 /* smoothing / peak hold */
 if(SP.run){if(!SP.tr||SP.tr.length!==d.mag.length)SP.tr=Float64Array.from(d.mag);else if(SP.avg>0){const a=1/SP.avg;for(let i=0;i<=M;i++)SP.tr[i]+=(d.mag[i]-SP.tr[i])*a}else SP.tr.set(d.mag);
  if(SP.hold){if(!SP.pk||SP.pk.length!==d.mag.length)SP.pk=Float64Array.from(SP.tr);else for(let i=0;i<=M;i++)if(SP.tr[i]>SP.pk[i])SP.pk[i]=SP.tr[i]}else SP.pk=null}
 const tr=SP.tr||d.mag;
 let fm;if(SP.fmax==='full')fm=d.fs/2;else if(SP.fmax==='auto'){const q=spPeak({mag:tr.slice(0,M+1),bin:d.bin,enbw:d.enbw});fm=q.f>0?niceMax(Math.max(q.f*10,d.bin*40)):d.fs/2}else fm=+SP.fmax;
 const fmax=Math.min(fm,d.fs/2),kmax=Math.max(2,Math.min(M,Math.floor(fmax/d.bin))),fmin=d.bin;
 const xf=f=>SP.xs==='log'?x0+Math.log(Math.max(f,fmin)/fmin)/Math.log(fmax/fmin)*pw:x0+f/fmax*pw;
 let mx=0;for(let i=1;i<=kmax;i++)mx=Math.max(mx,tr[i]);const dcv=tr[0];
 let top,bot;if(SP.yu==='db'){top=Math.ceil((spdb(Math.max(mx,1e-9))+1)/10)*10;bot=top-SP.range}else{top=niceMax(mx*1.05);bot=0}
 const rows=SP.yu==='db'?Math.max(2,Math.round(SP.range/10)):8;
 const yv=v=>{const t=SP.yu==='db'?(spdb(v)-bot)/(top-bot):(v-bot)/(top-bot);return y1-Math.max(-.05,Math.min(1.05,t))*ph};
 /* grid */
 g.strokeStyle='#1f3d2b';g.lineWidth=1;g.beginPath();for(let j=0;j<=rows;j++){const y=y0+j*ph/rows+.5;g.moveTo(x0,y);g.lineTo(x1,y)}
 if(SP.xs==='log'){const dec=Math.log10(fmax/fmin);for(let e=Math.floor(Math.log10(fmin));e<=Math.ceil(Math.log10(fmax));e++)for(let m=1;m<10;m++){const f=m*Math.pow(10,e);if(f<fmin||f>fmax)continue;const x=xf(f)+.5;g.moveTo(x,y0);g.lineTo(x,y1)}}
 else for(let i=0;i<=10;i++){const x=x0+i*pw/10+.5;g.moveTo(x,y0);g.lineTo(x,y1)}g.stroke();
 g.strokeStyle='#2f6b46';g.strokeRect(x0+.5,y0+.5,pw,ph);
 g.fillStyle='#9ca3af';g.textAlign='right';for(let j=0;j<=rows;j++){const v=top-(top-bot)*j/rows;g.fillText(SP.yu==='db'?v.toFixed(0):fmt(v,'V').replace(' V','V'),x0-4,y0+j*ph/rows+4)}
 g.textAlign='center';if(SP.xs==='log'){[1,10,100,1e3,1e4,1e5,1e6].forEach(f=>{if(f>=fmin&&f<=fmax)g.fillText(sfa(f),xf(f),y1+14)})}else for(let i=0;i<=10;i+=2)g.fillText(sfa(fmax*i/10),x0+i*pw/10,y1+14);
 g.textAlign='left';g.fillText(SP.yu==='db'?'dBV':'V pk',4,y0+10);
 /* traces */
 const draw=(arr,col,w)=>{g.strokeStyle=col;g.lineWidth=w;g.beginPath();let first=true;for(let i=1;i<=kmax;i++){const x=xf(i*d.bin),y=yv(arr[i]);if(first){g.moveTo(x,y);first=false}else g.lineTo(x,y)}g.stroke()};
 if(SP.pk)draw(SP.pk,'#2f7d52',1);draw(tr,'#facc15',1.4);
 /* peak + THD */
 let pkr={k:0,f:0,a:0};{const dd={mag:tr,bin:d.bin};const m=tr.slice(0,kmax+1);pkr=spPeak({mag:m,bin:d.bin,enbw:d.enbw})}
 let ro='';
 if(pkr.f>0){const px=xf(pkr.f),py=yv(pkr.a);g.fillStyle='#f87171';g.beginPath();g.moveTo(px,py-3);g.lineTo(px-5,py-12);g.lineTo(px+5,py-12);g.fill();
  let hs=0;for(let h=2;h<=10;h++){const kh=Math.round(pkr.f*h/d.bin);if(kh>M-2)break;const m=lobe(tr,kh,d.enbw);hs+=m*m}
  ro+='Peak  '+sfq(pkr.f)+'   '+fmt(pkr.a,'V')+' pk   '+fmt(pkr.a/Math.SQRT2,'V')+' rms   '+spdb(pkr.a).toFixed(1)+' dBV\nTHD (2nd-10th harmonic)  '+(pkr.a>0?(Math.sqrt(hs)/pkr.a*100).toFixed(2):'0')+' %\n'}
 else ro+='No AC component found\n';
 ro+='DC  '+fmt(d.dc,'V')+'    Total rms  '+fmt(d.rms,'V')+'\n';
 if(SP.mk!==null){const f=SP.xs==='log'?fmin*Math.pow(fmax/fmin,SP.mk):SP.mk*fmax,k=Math.max(0,Math.min(kmax,Math.round(f/d.bin))),mxp=x0+SP.mk*pw;g.strokeStyle='#ffffff';g.setLineDash([4,4]);g.beginPath();g.moveTo(mxp,y0);g.lineTo(mxp,y1);g.stroke();g.setLineDash([]);
  ro+='Marker  '+sfq(k*d.bin)+'   '+fmt(tr[k],'V')+' pk   '+spdb(tr[k]).toFixed(1)+' dBV\n'}
 ro+='fs '+sfq(d.fs)+'   N '+d.N+'   resolution '+sfq(d.bin)+'   window '+SP.win+(SP.avg?'   avg '+SP.avg:'');
 $('spro').textContent=ro}
